name = "meralion-vapi-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# After deploying, set your MERaLiON API key as a secret:
#   wrangler secret put MERALION_API_KEY
#
# Then in VAPI Custom LLM settings:
#   URL: https://meralion-vapi-proxy.<your-subdomain>.workers.dev/v1
#   Model: MERaLiON/MERaLiON-3-100   (or leave as-is — worker overwrites it)
